name: NavDemo
options:
  bundleIdPrefix: dev.navdemo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
targets:
  NavDemo:
    type: application
    platform: iOS
    sources:
      - path: NavDemo
      - path: ../shared/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.navdemo.ios
        INFOPLIST_FILE: NavDemo/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
